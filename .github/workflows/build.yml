name: Build firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes the builds of an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Firmware (SDK + ImageBuilder) and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Lint shell scripts
        run: |
          pip install --quiet shellcheck-py
          cd feed/utils/pirate-radio/files
          shellcheck -s sh -e SC1091,SC3043 -x job.sh pirate-radio.cli status.cgi pirate-radio.defaults pirate-radio.hotplug pirate-radio.migrate
          shellcheck -s sh -e SC3043,SC2034 lib.sh
          shellcheck -s sh -e SC1091,SC2034,SC3043,SC2154 pirate-radio.init
          cd "$GITHUB_WORKSPACE"
          shellcheck -s sh -e SC1091,SC3043 feed/utils/pirate-radio-ui/root/usr/libexec/rpcd/pirate.sdr
          shellcheck -s sh -e SC1091,SC3043 feed/utils/pirate-radio-ui/root/usr/sbin/pirate-recon feed/utils/pirate-radio-ui/root/usr/sbin/pirate-survey feed/utils/pirate-radio-ui/root/usr/sbin/pirate-threats feed/utils/pirate-radio-ui/root/usr/sbin/pirate-dashboard feed/utils/pirate-radio-ui/root/usr/libexec/rpcd/pirate.recon feed/utils/pirate-radio-ui/root/etc/uci-defaults/95-pirate-recon-gpsd
          shellcheck -s sh feed/utils/pirate-radio-ui/files/95-pirate-radio-ui feed/utils/pirate-radio-ui/root/etc/hotplug.d/iface/30-pirate-local
          shellcheck -s sh -e SC1091,SC3043,SC2034 feed/utils/pirate-radio-ui/root/usr/sbin/pirate-router feed/utils/pirate-radio-ui/root/usr/libexec/rpcd/pirate.router
          shellcheck -s sh -e SC1091,SC3043,SC2034 feed/utils/pirate-radio-ui/root/usr/sbin/pirate-access feed/utils/pirate-radio-ui/root/usr/libexec/rpcd/pirate.access feed/utils/pirate-radio-ui/root/etc/uci-defaults/96-pirate-terminal
          shellcheck -s sh -e SC1091,SC3043,SC2034 feed/utils/pirate-radio-ui/root/usr/sbin/pirate-capture feed/utils/pirate-radio-ui/root/usr/libexec/rpcd/pirate.capture
          shellcheck -s sh -e SC1091,SC3043,SC2034 feed/utils/pirate-radio-ui/root/usr/sbin/pirate-handshake feed/utils/pirate-radio-ui/root/usr/libexec/rpcd/pirate.handshake
          shellcheck -s sh -e SC1091,SC3043,SC2034 feed/utils/pirate-radio-ui/root/usr/sbin/pirate-firmware feed/utils/pirate-radio-ui/root/usr/libexec/rpcd/pirate.firmware
          shellcheck -s sh -e SC1091,SC3043 feed/utils/pirate-radio-ui/files/pirate-upload
          shellcheck -s sh -e SC1091,SC3043,SC2034 feed/utils/pirate-radio-ui/root/usr/sbin/pirate-gps feed/utils/pirate-radio-ui/root/etc/init.d/pirate-gps feed/utils/pirate-radio-ui/root/etc/hotplug.d/tty/20-pirate-gps
          shellcheck -s sh -e SC1091,SC3043,SC2034 feed/utils/pirate-radio-ui/root/usr/sbin/pirate-usb feed/utils/pirate-radio-ui/root/etc/init.d/pirate-usb feed/utils/pirate-radio-ui/root/etc/hotplug.d/block/05-pirate-usb feed/utils/pirate-radio-ui/root/etc/hotplug.d/block/20-pirate-usb-card feed/utils/pirate-radio-ui/root/etc/uci-defaults/96-pirate-usb feed/utils/pirate-radio-ui/root/usr/libexec/rpcd/pirate.usb
          shellcheck -s sh -e SC1091,SC3043,SC2034 feed/utils/pirate-radio-ui/root/usr/sbin/pirate-dreampi feed/utils/pirate-radio-ui/root/usr/libexec/rpcd/pirate.dreampi
          shellcheck -s sh -e SC1091,SC3043,SC2034 feed/utils/pirate-radio-ui/root/usr/sbin/pirate-phone feed/utils/pirate-radio-ui/root/usr/libexec/rpcd/pirate.phone feed/utils/pirate-radio-ui/root/etc/hotplug.d/usb/30-pirate-phone
          shellcheck -s sh -e SC1091,SC3043 feed/utils/pirate-radio-ui/files/pirate-phone-dl
          shellcheck -s sh -e SC1091,SC3043,SC2034 feed/utils/pirate-flipper/files/pirate-flipper.init
          shellcheck -s sh -e SC1091,SC3043,SC2034 feed/utils/pirate-meshcore/files/pirate-meshcore.init
          shellcheck -s sh -e SC1091,SC3043,SC2034 feed/utils/pirate-portapack/files/pirate-portapack.init
          shellcheck -s sh -e SC1091,SC3043,SC2034 feed/utils/pirate-bluetooth/files/pirate-bluetooth.init
          cd feed/net/dreampi/files
          shellcheck -s sh -e SC1091,SC3043,SC2034,SC2154 call.sh dcnow.sh nat.sh lib.sh dreampi.init dreampi.hotplug dreampi.defaults
          cd "$GITHUB_WORKSPACE"
          shellcheck -s sh build.sh build-full.sh scripts/*.sh tests/run.sh tests/websdr/run.sh
          shellcheck -s sh -e SC3043,SC2016,SC2012,SC1091,SC2015 tests/rootfs-test.sh

      - name: Build
        run: |
          ./build.sh
          for f in out/firmware/*sysupgrade.bin; do
            echo "::notice title=Firmware::$(basename "$f") ($(du -h "$f" | cut -f1))"
          done

      - uses: actions/upload-artifact@v6
        with:
          name: pirate-radio-firmware
          path: |
            out/firmware/*sysupgrade.bin
            out/firmware/*.manifest
            out/firmware/sha256sums
            out/packages/*.apk

      - name: Test on OpenWrt's MIPS userland (QEMU)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user-static
          # A binfmt entry for big-endian MIPS that works inside containers
          # (flag F); register it if the package did not.
          if [ ! -e /proc/sys/fs/binfmt_misc/qemu-mips ]; then
            grep -v '^#' /usr/lib/binfmt.d/qemu-mips.conf | head -n 1 |
              sudo tee /proc/sys/fs/binfmt_misc/register > /dev/null
          fi
          grep -E '^(enabled|interpreter|flags)' /proc/sys/fs/binfmt_misc/qemu-mips
          set -o pipefail
          sh tests/run.sh out/packages 2>&1 | tee test.log

      # Job logs are not always at hand; failures also go to annotations.
      - name: Report test failures
        if: failure()
        run: |
          [ -f test.log ] || exit 0
          tail -n 40 test.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g;s/^/::error title=Test log (last 40 lines)::/'
          grep '^FAIL - ' test.log | head -n 8 | sed 's/^FAIL - /::error title=Test failed::/' || true

  # The receiver in the web UI (the Listen page), away from the router: its
  # engine is JavaScript and its bridge builds for any machine with a simulated
  # radio, so both are tested here in a minute or two, long before the
  # firmware is built.
  websdr:
    name: Web receiver (engine and bridge, on this machine)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # The browser's side: the signal processing against made-up signals, and
      # the engine against a stand-in for the bridge. Node alone, no packages.
      - name: Engine (the browser's side)
        run: node tests/sdr/run.js

      # The Bluetooth page's part in the browser: what it makes of what a
      # dongle hears, which the router only hands on. Node alone as well.
      - name: Bluetooth page (the browser's side)
        run: node tests/bt/run.js

      # The router's side, built for this machine: the protocol end to end
      # against its simulated radio, and again under the address and
      # undefined-behaviour sanitizers. With SoapySDR's headers installed, the
      # source for the real radios is built as well, and tested with a
      # stand-in for the library and its drivers behind it.
      - name: Bridge (the router's side)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libsoapysdr-dev
          sh tests/websdr/run.sh

  full:
    name: Firmware with Wi-Fi spectral scan (full source build)
    # Every push to main and every manual run; pull requests get the quick
    # build only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget xsltproc

      - name: Build
        run: |
          ./build-full.sh
          for f in out/firmware-full/*sysupgrade.bin; do
            echo "::notice title=Firmware (full)::$(basename "$f") ($(du -h "$f" | cut -f1))"
          done

      - uses: actions/upload-artifact@v6
        with:
          name: pirate-radio-firmware-full
          path: out/firmware-full/

      # Job logs are not always at hand: the failed steps and the end of
      # their logs also go to annotations, and all build logs to an artifact.
      - name: Report build failure
        if: failure()
        run: |
          f=build/openwrt/logs/failure.txt
          [ -f "$f" ] || exit 0
          grep -o 'ERROR: [^ ]* failed to build' "$f" | sort -u | head -n 3 |
            sed 's/^/::error title=Full build::/'
          awk '/^== / { n++ } { print > ("part" n ".txt") }' "$f"
          for p in $(ls part*.txt | sort -V | head -n 6); do
            sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g;s/^/::error title=Full build log::/' "$p"
          done

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: full-build-logs
          path: build/openwrt/logs/
