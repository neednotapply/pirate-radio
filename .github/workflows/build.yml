name: Build firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes the builds of an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Firmware (SDK + ImageBuilder) and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Lint shell scripts
        run: |
          pip install --quiet shellcheck-py
          cd feed/utils/slate-sdr/files
          shellcheck -s sh -e SC1091,SC3043 -x job.sh slate-sdr.cli status.cgi slate-sdr.defaults slate-sdr.hotplug
          shellcheck -s sh -e SC3043,SC2034 lib.sh
          shellcheck -s sh -e SC1091,SC2034,SC3043,SC2154 slate-sdr.init
          cd "$GITHUB_WORKSPACE"
          shellcheck -s sh -e SC1091,SC3043 feed/utils/slate-ui/root/usr/libexec/rpcd/luci.slate-sdr
          shellcheck -s sh -e SC1091,SC3043 feed/utils/slate-ui/root/usr/sbin/slate-recon feed/utils/slate-ui/root/usr/sbin/slate-survey feed/utils/slate-ui/root/usr/sbin/slate-threats feed/utils/slate-ui/root/usr/sbin/slate-dashboard feed/utils/slate-ui/root/usr/libexec/rpcd/luci.slate-recon feed/utils/slate-ui/root/etc/uci-defaults/95-slate-recon-gpsd
          shellcheck -s sh feed/utils/slate-ui/files/95-slate-ui
          shellcheck -s sh -e SC1091,SC3043,SC2034 feed/utils/slate-ui/root/usr/sbin/slate-router feed/utils/slate-ui/root/usr/libexec/rpcd/luci.slate-router
          shellcheck -s sh -e SC1091,SC3043,SC2034 feed/utils/slate-ui/root/usr/sbin/slate-capture feed/utils/slate-ui/root/usr/libexec/rpcd/luci.slate-capture
          shellcheck -s sh -e SC1091,SC3043,SC2034 feed/utils/slate-ui/root/usr/sbin/slate-handshake feed/utils/slate-ui/root/usr/libexec/rpcd/luci.slate-handshake
          shellcheck -s sh -e SC1091,SC3043,SC2034 feed/utils/slate-ui/root/usr/sbin/slate-firmware feed/utils/slate-ui/root/usr/libexec/rpcd/luci.slate-firmware
          shellcheck -s sh -e SC1091,SC3043 feed/utils/slate-ui/files/slate-upload
          shellcheck -s sh -e SC1091,SC3043,SC2034 feed/utils/slate-ui/root/usr/sbin/slate-gps feed/utils/slate-ui/root/etc/init.d/slate-gps feed/utils/slate-ui/root/etc/hotplug.d/tty/20-slate-gps
          shellcheck -s sh -e SC1091,SC3043,SC2034 feed/utils/slate-ui/root/usr/sbin/slate-dreampi feed/utils/slate-ui/root/usr/libexec/rpcd/luci.slate-dreampi
          cd feed/net/dreampi/files
          shellcheck -s sh -e SC1091,SC3043,SC2034,SC2154 call.sh dcnow.sh nat.sh lib.sh dreampi.init dreampi.hotplug dreampi.defaults
          cd "$GITHUB_WORKSPACE"
          shellcheck -s sh build.sh build-full.sh scripts/*.sh tests/run.sh
          shellcheck -s sh -e SC3043,SC2016,SC2012,SC1091,SC2015 tests/rootfs-test.sh

      - name: Build
        run: |
          ./build.sh
          for f in out/firmware/*sysupgrade.bin; do
            echo "::notice title=Firmware::$(basename "$f") ($(du -h "$f" | cut -f1))"
          done

      - uses: actions/upload-artifact@v6
        with:
          name: slate-sdr-firmware
          path: |
            out/firmware/*sysupgrade.bin
            out/firmware/*.manifest
            out/firmware/sha256sums
            out/packages/*.apk

      - name: Test on OpenWrt's MIPS userland (QEMU)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user-static
          # A binfmt entry for big-endian MIPS that works inside containers
          # (flag F); register it if the package did not.
          if [ ! -e /proc/sys/fs/binfmt_misc/qemu-mips ]; then
            grep -v '^#' /usr/lib/binfmt.d/qemu-mips.conf | head -n 1 |
              sudo tee /proc/sys/fs/binfmt_misc/register > /dev/null
          fi
          grep -E '^(enabled|interpreter|flags)' /proc/sys/fs/binfmt_misc/qemu-mips
          set -o pipefail
          sh tests/run.sh out/packages 2>&1 | tee test.log

      # Job logs are not always at hand; failures also go to annotations.
      - name: Report test failures
        if: failure()
        run: |
          [ -f test.log ] || exit 0
          tail -n 40 test.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g;s/^/::error title=Test log (last 40 lines)::/'
          grep '^FAIL - ' test.log | head -n 8 | sed 's/^FAIL - /::error title=Test failed::/' || true

  full:
    name: Firmware with Wi-Fi spectral scan (full source build)
    # Every push to main and every manual run; pull requests get the quick
    # build only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget xsltproc

      - name: Build
        run: |
          ./build-full.sh
          for f in out/firmware-full/*sysupgrade.bin; do
            echo "::notice title=Firmware (full)::$(basename "$f") ($(du -h "$f" | cut -f1))"
          done

      - uses: actions/upload-artifact@v6
        with:
          name: slate-sdr-firmware-full
          path: out/firmware-full/

      # Job logs are not always at hand: the failed steps and the end of
      # their logs also go to annotations, and all build logs to an artifact.
      - name: Report build failure
        if: failure()
        run: |
          f=build/openwrt/logs/failure.txt
          [ -f "$f" ] || exit 0
          grep -o 'ERROR: [^ ]* failed to build' "$f" | sort -u | head -n 3 |
            sed 's/^/::error title=Full build::/'
          awk '/^== / { n++ } { print > ("part" n ".txt") }' "$f"
          for p in $(ls part*.txt | sort -V | head -n 6); do
            sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g;s/^/::error title=Full build log::/' "$p"
          done

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: full-build-logs
          path: build/openwrt/logs/
